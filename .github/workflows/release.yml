name: Release

# Push a tag such as v0.1.0-beta.1. Tags with a suffix are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # CFBundleShortVersionString must be numeric: 0.1.0-beta.1 -> 0.1.0
          echo "MARKETING=${version%%-*}" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: MHubKit tests (shared contract)
        run: swift test --package-path MHubKit
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Archive (unsigned)
        run: >
          xcodebuild -project MHub.xcodeproj -scheme MHub -configuration Release
          -destination 'generic/platform=iOS' -archivePath build/MHub.xcarchive
          MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="${{ github.run_number }}" MHUB_VERSION="$VERSION"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          -skipMacroValidation archive -quiet
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/MHub.xcarchive/Products/Applications/MHub.app build/Payload/
          cd build
          zip -qry "MHub-$VERSION-unsigned.ipa" Payload
          shasum -a 256 "MHub-$VERSION-unsigned.ipa" | tee "MHub-$VERSION-unsigned.ipa.sha256"
      - name: Archive Mac app (ad-hoc signed)
        # Apple silicon runs no unsigned code, so the Mac app is signed ad hoc.
        run: >
          xcodebuild -project MHub.xcodeproj -scheme MHub -configuration Release
          -destination 'generic/platform=macOS,variant=Mac Catalyst' -archivePath build/MHub-mac.xcarchive
          MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="${{ github.run_number }}" MHUB_VERSION="$VERSION"
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          -skipMacroValidation archive -quiet
      - name: Package Mac app
        run: |
          cd build
          app=MHub-mac.xcarchive/Products/Applications/MHub.app
          # A disk image with MHub and a link to Applications to drag it onto.
          mkdir dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "MHub $VERSION" -srcfolder dmg -fs HFS+ -format UDZO -ov "MHub-$VERSION-mac.dmg"
          shasum -a 256 "MHub-$VERSION-mac.dmg" | tee "MHub-$VERSION-mac.dmg.sha256"
          # The zip stays for Mac apps up to 0.1.0-beta.9, whose update check looks for it.
          ditto -c -k --keepParent "$app" "MHub-$VERSION-mac.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # What changed comes first: the app's update prompt shows the first lines.
          if [ -f "release-notes/${VERSION}.md" ]; then cat "release-notes/${VERSION}.md"; echo; fi > build/notes.md
          cat >> build/notes.md <<NOTES
          MHub iOS ${VERSION}。需要 iOS／iPadOS 16 或更新（iOS 26 起为液态玻璃界面）；默认连接公共服务器 https://music.op.wiki，也可在设置里改为自托管的 [MHub](https://github.com/jizizr/mhub) 服务端。

          **未签名 IPA**：用 AltStore、SideStore、Sideloadly 或 TrollStore 以你自己的 Apple ID 签名后安装。免费 Apple ID 签名 7 天后需重新签名。

          **Mac 版**（\`-mac.dmg\`，需 macOS 13 或更新，Intel 与 Apple 芯片通用）：打开后把 MHub 拖进「应用程序」。\`-mac.zip\` 内容相同，供 0.1.0-beta.9 及更早的 Mac 版自动更新使用。未经 Apple 公证，首次打开若提示「已损坏」或「无法验证开发者」，在终端运行 \`xattr -dr com.apple.quarantine /Applications/MHub.app\` 后再打开。

          App 会自动检查新版本（设置 › 关于）。
          NOTES
          gh release create "$GITHUB_REF_NAME" $prerelease --verify-tag \
            --title "MHub $VERSION" --notes-file build/notes.md \
            "build/MHub-$VERSION-unsigned.ipa" "build/MHub-$VERSION-unsigned.ipa.sha256" \
            "build/MHub-$VERSION-mac.dmg" "build/MHub-$VERSION-mac.dmg.sha256" "build/MHub-$VERSION-mac.zip"
