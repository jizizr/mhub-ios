name: Release

# Push a tag such as v0.1.0-beta.1. Tags with a suffix are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # CFBundleShortVersionString must be numeric: 0.1.0-beta.1 -> 0.1.0
          echo "MARKETING=${version%%-*}" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: MHubKit tests (shared contract)
        run: swift test --package-path MHubKit
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Archive (unsigned)
        run: >
          xcodebuild -project MHub.xcodeproj -scheme MHub -configuration Release
          -destination 'generic/platform=iOS' -archivePath build/MHub.xcarchive
          MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="${{ github.run_number }}" MHUB_VERSION="$VERSION"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          archive -quiet
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/MHub.xcarchive/Products/Applications/MHub.app build/Payload/
          cd build
          zip -qry "MHub-$VERSION-unsigned.ipa" Payload
          shasum -a 256 "MHub-$VERSION-unsigned.ipa" | tee "MHub-$VERSION-unsigned.ipa.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > build/notes.md <<NOTES
          MHub iOS $VERSION。需要 iOS 26 及自托管的 [MHub](https://github.com/jizizr/mhub) 服务端。

          **未签名 IPA**：用 AltStore、SideStore、Sideloadly 或 TrollStore 以你自己的 Apple ID 签名后安装。免费 Apple ID 签名 7 天后需重新签名。

          首次启动填写服务端地址（保存前会请求 \`/health\`）。
          NOTES
          gh release create "$GITHUB_REF_NAME" $prerelease --verify-tag \
            --title "MHub iOS $VERSION" --notes-file build/notes.md \
            "build/MHub-$VERSION-unsigned.ipa" "build/MHub-$VERSION-unsigned.ipa.sha256"
