# XcodeGen spec. The .xcodeproj is generated (and git-ignored):
#   xcodegen generate
name: MHub
options:
  bundleIdPrefix: io.github.mhub
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MHUB_VERSION: ""
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  MHubKit:
    path: MHubKit
  # Observation back-port: @Perceptible models track like @Observable on
  # iOS 16 and are plain Observation on iOS 17+.
  Perception:
    url: https://github.com/pointfreeco/swift-perception
    from: 2.0.12
targets:
  MHub:
    type: application
    platform: iOS
    sources:
      - path: MHub
    dependencies:
      - package: MHubKit
      - package: Perception
    info:
      path: MHub/Resources/Info.plist
      properties:
        CFBundleDisplayName: MHub
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The full tag version (0.1.0-beta.2) for update checks; empty in local builds.
        MHubVersion: $(MHUB_VERSION)
        # Downloads land in Documents, shown in Files under「我的 iPhone › MHub」.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationCategoryType: public.app-category.music
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad":
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Self-hosted servers may be plain HTTP on a LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 连接局域网中的 MHub 服务器
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mhub.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2,6"
        # Mac Catalyst with the Mac idiom (native controls and text sizes);
        # the same bundle id, so settings and downloads use the app's own container.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
schemes:
  MHub:
    build:
      targets:
        MHub: all
    test:
      targets: []
